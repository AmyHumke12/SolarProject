name: Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 8 AM Central Time (1 PM UTC)
  workflow_dispatch:  # Allows manual execution from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Setup Script
        run: bash setup.sh

      - name: Run update_data.py
        env:
          SOLAREDGE_API_KEY: ${{ secrets.SOLAREDGE_API_KEY }}
          SOLAREDGE_SITE_ID: ${{ secrets.SOLAREDGE_SITE_ID }}
          GIT: ${{ secrets.GITHUB_TOKEN }}  # ✅ This line enables upload to GitHub from notebook
        run: |
          python scripts/update_data.py | tee -a execution_log.txt

      - name: Debug - Show Execution Log
        run: cat execution_log.txt

      - name: git config --list
        run: git config --list

      - name: Commit and Push if Changed (Force Pickle Update)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ✅ Always set Git identity first
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # ✅ Set the remote URL with token
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # ✅ Checkout and sync main
          git checkout main
          git fetch origin main
          git reset --hard origin/main

          # ✅ Force a change to pickle to trigger commit
          echo "Last updated: $(date)" >> bi_solar_dashboard_final_csv.csv
          git add bi_solar_dashboard_final_csv.csv

          # ✅ Commit (skip error if nothing changed)
          git commit -m "Automated daily update - $(date)" || echo "No changes to commit"

          # ✅ Push with auth
          git push origin main --force

