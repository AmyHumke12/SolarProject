name: Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual execution from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # This prevents Git from checking submodules
          fetch-depth: 0 # Ensures full history is fetched, preventing sync issues

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug - List repository files
        run: ls -R

      - name: Run Jupyter Notebook and Streamlit App
        run: |
          pip install nbconvert streamlit  # Ensures both dependencies are installed
          python scripts/update_data.py

        
      - name: Debug - Check if Pickle File is Ignored
        run: cat .gitignore | grep 'pkl' || echo "No .pkl ignore rule found"
        
      - name: Debug - Check Pickle File
        run: |
          if [ -f "bi_solar_dashboard_final.pkl" ]; then
            echo "✅ Pickle file found!"
            ls -lh bi_solar_dashboard_final.pkl
          else
            echo "❌ Pickle file not found!"
            exit 1  # Stop workflow if the file is missing
          fi

      - name: Commit and Push if changed (Force Pickle Update)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Ensure we are on the main branch
          git checkout main
          
          # Fetch latest changes and reset to match remote
          git fetch origin main
          git reset --hard origin/main

          # Debug: Check if Pickle File Exists
          if [ -f "bi_solar_dashboard_final.pkl" ]; then
            echo "✅ Pickle file found!"
            ls -lh bi_solar_dashboard_final.pkl
          else
            echo "❌ Pickle file not found!"
            exit 1  # Fail workflow if missing
          fi

          # Modify the file slightly to force Git to detect a change
          echo "Last updated: $(date)" >> bi_solar_dashboard_final.pkl

          # Ensure Git Tracks the File
          git add bi_solar_dashboard_final.pkl

          # Commit and Push
          git commit -m "Automated daily update - $(date)" || echo "No changes to commit"
          git push origin main --force




