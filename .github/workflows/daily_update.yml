name: Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 8 AM Central Time (1 PM UTC)
  workflow_dispatch:  # Allows manual execution from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Setup Script
        run: bash setup.sh

      - name: Run update_data.py
        env:
          SOLAREDGE_API_KEY: ${{ secrets.SOLAREDGE_API_KEY }}
          SOLAREDGE_SITE_ID: ${{ secrets.SOLAREDGE_SITE_ID }}
          GIT: ${{ secrets.GITHUB_TOKEN }}  # ✅ This line enables upload to GitHub from notebook
        run: |
          python scripts/update_data.py | tee -a execution_log.txt

      - name: Debug - Show Execution Log
        run: cat execution_log.txt

      - name: git config --list
        run: git config --list

      - name: Commit and Push if CSV Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # ✅ Authenticated remote
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git checkout main
          git fetch origin main
          git reset --hard origin/main

          echo "✅ CSV generated: $(date)"  # ✅ No longer bloats the CSV
          git add bi_solar_dashboard_final_csv.csv

          git commit -m "Automated daily CSV update - $(date)" || echo "No changes to commit"
          git push origin main
      # ----------------------------
      # NEW STEPS FOR GOOGLE DRIVE
      # ----------------------------
      - name: Install Google Drive libraries
        run: |
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Upload CSV to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/gdrive_upload.py


