name: Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual execution from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # This prevents Git from checking submodules

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug - List repository files
        run: ls -R

      - name: Run data refresh script
        run: python scripts/update_data.py
        
      - name: Debug - Show Git Status
        run: |
          git status
          git log -1

      - name: Commit and Push if changed (Force Update)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Ensure we are on the main branch
          git checkout main
          
          # Fetch latest changes and reset to match remote
          git fetch origin main
          git reset --hard origin/main

          # Force Git to detect changes
          echo "Last updated on $(date)" > last_update.txt
          git add last_update.txt

          # Commit only if there are changes
          git commit -m "Automated daily data update" || echo "No changes to commit"

          # Push to main branch
          git push origin main --force




