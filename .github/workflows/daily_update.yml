name: Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 8 AM Central Time (1 PM UTC)
  workflow_dispatch: # Allows manual execution from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # Prevents submodule errors
          fetch-depth: 0  # Ensures full history is fetched, preventing sync issues

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt  # Ensures all required dependencies are installed

      - name: Install Jupyter Kernel
        run: python -m ipykernel install --user --name=python3

      - name: Run Data Update Script
        run: |
          python scripts/update_data.py | tee execution_log.txt

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute BI_Solar_Production_Prediction.ipynb \
            --ExecutePreprocessor.kernel_name=python3 --output output.ipynb | tee -a execution_log.txt

      - name: Debug - Show Execution Log
        run: cat execution_log.txt

      - name: Commit and Push if Changed (Force Pickle Update)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Ensure we are on the main branch
          git checkout main
          
          # Fetch latest changes and reset to match remote
          git fetch origin main
          git reset --hard origin/main

          # Debug: Check if Pickle File Exists
          if [ -f "bi_solar_dashboard_final.pkl" ]; then
            echo "✅ Pickle file found!"
            ls -lh bi_solar_dashboard_final.pkl
          else
            echo "❌ Pickle file not found!"
            exit 1  # Fail workflow if missing
          fi

          # Modify the file slightly to force Git to detect a change
          echo "Last updated: $(date)" >> bi_solar_dashboard_final.pkl

          # Ensure Git Tracks the File
          git add bi_solar_dashboard_final.pkl

          # Commit and Push
          git commit -m "Automated daily update - $(date)" || echo "No changes to commit"
          git push origin main --force
